  <body>
    <!--
      Magic-link sign-in used to be handled by an inline script here: it removed the
      module bundle, exchanged ?login=<token> for a session, and reloaded. That worked
      only when everything worked. A link that had expired, had already been used, or
      simply hit a bad minute was stripped from the URL and reloaded into the invite
      gate with nothing on screen to say why — the one screen the link exists to let
      someone skip.

      The app owns the exchange now (see patch-dashboard.mjs, "exchange a magic-link
      token for a session on load"). It strips the token from the address bar before
      calling the Worker, so the bearer credential never reaches history or a referrer,
      and it carries a failure to the invite screen as a named state the member can act
      on. Nothing may re-add a second consumer here: the link is single-use, so two
      consumers race to spend it and the loser reports a link that has "already been
      used".
    -->
    <div id="root"></div>
  </body>
