<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in · Job Scout</title>
    <style>
      /* Fonts are served from this origin -- see assets/fonts/README.md.
         Schibsted Grotesk is variable, so weights 400-700 arrive in one file per
         subset and eight @font-face blocks collapse to two. This page carries no
         data role -- no salary, date, source or count -- so it does not declare
         IBM Plex Mono, which is the dashboard's face for measured values. */
      @font-face{font-family:'Schibsted Grotesk';font-style:normal;font-weight:400 700;font-display:swap;src:url('./assets/fonts/schibsted-grotesk-latin-ext.woff2') format('woff2');unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF}
      @font-face{font-family:'Schibsted Grotesk';font-style:normal;font-weight:400 700;font-display:swap;src:url('./assets/fonts/schibsted-grotesk-latin.woff2') format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
    </style>
    <style>
      /* Tokens copied from the dashboard bundle's :root so this standalone page
         reads as the same product as index.html. Copied, which means they drift:
         --ink-faint was still the pre-AA #999891 (2.89:1) here long after the app
         darkened it. Keep this block in step with the app's :root — see the
         theming contract in README.md. */
      :root {
        --canvas: #fbfbfa;
        --surface: #ffffff;
        --ink: #211f1c;
        --ink-soft: #6e6d67;
        --ink-faint: #73726c;
        --line: #deded8;
        --line-control: #84847a;
        --focus-ring: #245640;
        --green: #356e59;
        --green-deep: #245640;
        --green-pale: #e8f0eb;
        --clay: #9f5345;
        --shadow: 0 12px 28px rgba(33, 31, 28, 0.055);
        --card-radius: 14px;
        --control-height: 48px;

        /* Type roles, named for their job rather than their size. Eight steps
           with 12px as the floor, replacing a ramp that ran 10/12/13/14/15/20/22
           -- seven values inside 12px, several of which no longer told you which
           role you were reading. Tracking is in em so it survives a resize. */
        --font-ui: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
        --text-micro: 12px;
        --text-label: 14px;
        --text-caption: 14px;
        --text-body: 16px;
        --text-control: 16px;
        --text-subtitle: 18px;
        --text-title: 22px;
        --text-display: clamp(27px, 5vw, 33px);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 24px;
        background: var(--canvas);
        color: var(--ink);
        font-family: var(--font-ui);
        font-size: var(--text-body);
        line-height: 1.5;
      }
      .shell {
        width: 100%;
        max-width: 440px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0 0 20px;
      }
      .brand-mark {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border-radius: 10px;
        background: var(--green-deep);
        color: #fff;
      }
      .brand-name {
        font-size: var(--text-title);
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--card-radius);
        padding: clamp(24px, 3vw, 32px);
        box-shadow: var(--shadow);
      }
      .card-icon {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: var(--green-pale);
        color: var(--green);
        margin: 0 0 18px;
      }
      .eyebrow {
        margin: 0 0 8px;
        font-size: var(--text-micro);
        font-weight: 600;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--green);
      }
      h1 {
        margin: 0 0 10px;
        font-size: var(--text-display);
        font-weight: 700;
        /* Schibsted Grotesk is a news grotesque: it takes tighter tracking at
           display size than the serif it replaces, and needs it to stop looking
           loose. Still well inside the -0.04em floor. */
        letter-spacing: -0.03em;
        line-height: 1.08;
        /* Keeps "Email me a sign-in link" breaking at a sensible point rather
           than dropping one orphaned word. */
        text-wrap: balance;
      }
      p.lead {
        margin: 0 0 24px;
        /* 16px over a 440px card is ~52ch, inside the 45-75ch band; the extra
           leading is for the wider measure this face sets at the same size. */
        max-width: 62ch;
        line-height: 1.6;
        color: var(--ink-soft);
      }
      label {
        display: block;
        margin: 0 0 8px;
        font-size: var(--text-label);
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--ink-soft);
      }
      input[type="email"] {
        width: 100%;
        height: var(--control-height);
        padding: 13px 14px;
        font-family: inherit;
        /* 16px, not 15px: iOS Safari zooms the page on focus for anything below
           16px, which throws the layout mid-sign-in. */
        font-size: var(--text-control);
        color: var(--ink);
        background: var(--canvas);
        /* A control's edge, not a divider: 3:1 rather than the 1.3:1 --line gives.
           WCAG 1.4.11. */
        border: 1px solid var(--line-control);
        border-radius: 9px;
      }
      /* --ink-faint is only 2.9:1 on these surfaces, so placeholder and footer text
         use --ink-soft (5:1) to clear WCAG AA. */
      input[type="email"]::placeholder {
        color: var(--ink-soft);
        font-weight: 400;
      }
      button {
        width: 100%;
        margin-top: 16px;
        min-height: 48px;
        padding: 12px 16px;
        font-family: inherit;
        /* The primary action on the page was set at 13px, two steps under its own
           body copy. It now matches the control role it belongs to. */
        font-size: var(--text-control);
        font-weight: 600;
        color: #fff;
        background: var(--ink);
        border: 1px solid var(--ink);
        border-radius: 8px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      /*
        The same opaque ring the app uses. The translucent pine this replaces was
        about 1.5:1 against the page — a focus indicator you had to already know
        was there. The light gap keeps it visible on the dark primary button too.
        WCAG 1.4.11 and 2.4.11.
      */
      :is(a, button, input):focus-visible {
        outline: 3px solid var(--focus-ring);
        outline-offset: 2px;
        box-shadow: 0 0 0 2px var(--surface);
      }
      .status {
        margin: 14px 0 0;
        font-size: var(--text-caption);
        line-height: 1.55;
        min-height: 1.55em;
        color: var(--ink-soft);
      }
      .status[data-tone="ok"] {
        color: var(--green-deep);
      }
      .status[data-tone="error"] {
        color: var(--clay);
      }
      .foot {
        margin: 22px 0 0;
        padding-top: 18px;
        border-top: 1px solid var(--line);
        font-size: var(--text-caption);
        color: var(--ink-soft);
      }
      .foot a {
        color: var(--green-deep);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9" />
            <path d="M15.5 8.5l-2 5-5 2 2-5z" />
          </svg>
        </span>
        <span class="brand-name">Job Scout</span>
      </div>

      <main class="card">
        <span class="card-icon" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="5" width="18" height="14" rx="2.5" />
            <path d="M3.5 7.5l8.5 5.5 8.5-5.5" />
          </svg>
        </span>
        <p class="eyebrow">Private access</p>
        <h1>Email me a sign-in link</h1>
        <p class="lead">
          Lost your invite code? Enter the email on your Job Scout profile and we’ll send you a
          one-time link that signs you straight in.
        </p>
        <form id="form" novalidate>
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" required
            placeholder="you@example.com" />
          <button id="submit" type="submit">Email me a sign-in link</button>
        </form>
        <p id="status" class="status" role="status" aria-live="polite"></p>
        <p class="foot">Still have your code? <a href="./index.html">Open the dashboard</a>.</p>
      </main>
    </div>

    <script>
      // Wrapped in an IIFE so these never become globals — a top-level `var status`
      // would alias the special window.status property and silently break the form.
      (function () {
        var form = document.getElementById("form");
        var emailInput = document.getElementById("email");
        var submitButton = document.getElementById("submit");
        var statusEl = document.getElementById("status");

        function setStatus(message, tone) {
          statusEl.textContent = message;
          statusEl.setAttribute("data-tone", tone || "");
        }

        form.addEventListener("submit", function (event) {
          event.preventDefault();
          var email = emailInput.value.trim();
          if (!email || !emailInput.checkValidity()) {
            setStatus("Enter a valid email address.", "error");
            emailInput.focus();
            return;
          }
          submitButton.disabled = true;
          setStatus("Sending…", "");
          fetch("https://job-scout-intake.vakalaktika.workers.dev/", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ action: "magic_request", email: email }),
          })
            .then(function (response) {
              if (!response.ok) throw new Error("request_failed");
              return response.json();
            })
            .then(function () {
              // The endpoint always answers ok so it can't reveal which emails exist.
              setStatus(
                "If that email is on a Job Scout profile, a sign-in link is on its way. It expires in 15 minutes.",
                "ok",
              );
            })
            .catch(function () {
              setStatus("Something went wrong. Please try again in a moment.", "error");
              submitButton.disabled = false;
            });
        });
      })();
    </script>
  </body>
</html>
